name: CI

# `npm run check` is the gate: type check plus the Vitest suite, which carries
# the constitutional invariants (section marker, off-state never '0', no
# redundant defaults, configuration key coverage, build determinism). It runs
# identically locally.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gate only reads the repo, builds, and runs tests.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and test
        run: npm run check
