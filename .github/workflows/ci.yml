name: CI

# Two gates, kept separate so a browser install can never fail the fast one.
#
# check  `npm run check` - type check plus the Vitest suite, which carries the
#        constitutional invariants (section marker, off-state never '0', no
#        redundant defaults, configuration key coverage, build determinism).
#
# e2e    `npm run test:e2e` - the real app in a real browser against a mocked
#        OpenWrt. It is here for no-secret-egress.spec.ts above all: the promise
#        that root passwords, Wi-Fi passphrases and WireGuard keys never reach a
#        WrtNova backend is published in README.md, and that spec is the only
#        automated thing standing behind it.
#
# Both run identically locally.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gate only reads the repo, builds, and runs tests.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and test
        run: npm run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cached on the lockfile, so a run only pays the browser download when the
      # pinned Playwright version actually moves.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not the apt libraries it links
      # against, which live outside the cached path.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # --project=e2e is the gate; the `screens` project is the manual pass and
      # asserts nothing, so it has no business failing a build.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
