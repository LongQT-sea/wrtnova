name = "wrtnova"
pages_build_output_dir = "public"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages build step — runs before the public/ directory is published.
# Both CSS compilation and script embedding must complete before deploy.
#[build]
#command = "npm run build:css && node scripts/embed-wrtnova.mjs"

[vars]
ALLOWED_ORIGIN = "https://wrtnova.com"
# ASU_URL = "https://sysupgrade.openwrt.org"  # uncomment to override; defaults to official ASU

# ── Rate limiting (configure in CF dashboard, not here) ──────────────────────
# Security → WAF → Rate Limiting Rules:
#   /api/build          5  req / 1 min / IP
#   /api/warp/register  3  req / 1 min / IP
#   /api/session        10 req / 1 min / IP

[[kv_namespaces]]
binding = "wrtnova_kv"
id = "8b7fded68a9f47698e73b6ca5e5306cb"  # Set via `wrangler kv namespace create` per developer (see README.md)
