<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WrtNova firmware builder</title>
    <meta
      name="description"
      content="Build a custom OpenWrt image with the WrtNova first-boot provisioning script baked in. Everything is assembled in your browser."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The two fonts on the critical path. The rest load per unicode-range. -->
    <link
      rel="preload"
      href="/fonts/public-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Stamp the resolved theme before first paint, so there is no flash of the
      // wrong one. Kept inline and tiny on purpose; src/ui/theme.ts is the same
      // logic for everything after this point.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/builder/main.tsx"></script>
  </body>
</html>
